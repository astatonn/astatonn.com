services:
  astatonn-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astatonn-site
    user: "node"
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PROGRESS_FILE=/app/data/progress.json
    restart: unless-stopped
    read_only: true
    volumes:
      # Progresso dos projetos publicado pelo bot da VPS (vpsmon, projects.public_file) para a seção
      # "Now Building". A PASTA, só-leitura: o bot troca o arquivo de forma atômica (inode novo) e um
      # bind mount do arquivo ficaria preso na versão antiga.
      - /srv/astatonn.com/data:/app/data:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      # read_only impede o Next de gravar o cache do next/image: sem isto toda imagem é
      # reotimizada a cada request (e cada uma loga um unhandledRejection).
      - /app/.next/cache:noexec,nosuid,uid=1000,gid=1000,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
    name: proxy-network
