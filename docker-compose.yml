services:
  astatonn-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astatonn-site
    user: "node"
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
    name: proxy-network
