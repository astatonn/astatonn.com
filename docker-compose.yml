services:
  astatonn-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astatonn-site
    user: "node"
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      # read_only impede o Next de gravar o cache do next/image: sem isto toda imagem é
      # reotimizada a cada request (e cada uma loga um unhandledRejection).
      - /app/.next/cache:noexec,nosuid,uid=1000,gid=1000,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
    name: proxy-network
